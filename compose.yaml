name: wealthfolio-teste

services:
  wealthfolio:
    image: wealthfolio-teste:3.9.1-local
    # Upstream v3.9.1 fixado por commit, mais `patches/`: ver o Dockerfile.
    build:
      context: .
    restart: unless-stopped
    # Backup diário no VPS (`manutencao/vps/backup-db.sh`): o diretório deste
    # caminho, DENTRO do contêiner, é copiado com o contêiner pausado por
    # segundos, e o BackupRestore leva a cópia para fora do servidor. É o
    # SQLite cifrado, o `-wal` e o cofre de segredos; sem o rótulo, nada disso
    # entra no backup. A cópia só abre com a chave mestra.
    labels:
      mspa.backup.volume: /data
    ports:
      - "127.0.0.1:18088:8088"
    volumes:
      - wealthfolio-teste-data:/data
      - type: bind
        source: "${WF_SECRET_KEY_HOST_PATH:?Set WF_SECRET_KEY_HOST_PATH in the local .env file}"
        target: /run/secrets/wealthfolio_master_key
        read_only: true
        bind:
          create_host_path: false
    environment:
      WF_LISTEN_ADDR: "0.0.0.0:8088"
      WF_DB_PATH: "/data/wealthfolio.db"
      WF_SECRET_KEY: ""
      WF_SECRET_KEY_FILE: /run/secrets/wealthfolio_master_key
      WF_AUTH_PASSWORD_HASH: "${WF_AUTH_PASSWORD_HASH:?Set WF_AUTH_PASSWORD_HASH in the local .env file}"
      WF_CORS_ALLOW_ORIGINS: "https://networth-mspa.duckdns.org"
      WF_COOKIE_SECURE: "true"
      WF_DB_REQUIRE_ENCRYPTION: "1"
      WF_ADDON_NETWORK_PRIVATE_TARGETS: "${WF_ADDON_NETWORK_PRIVATE_TARGETS:-}"
      # Cron do CB/CRV (patch 0007), em America/Sao_Paulo. O padrão é 08:00 e
      # 14:00 de segunda a sexta; uma alteração no .env só exige recriar o
      # contêiner com a imagem existente.
      WF_PATRIMONIO_SYNC_CRON: "${WF_PATRIMONIO_SYNC_CRON:-0 8,14 * * 1-5}"
      # Compatibilidade para instalações sem cron: intervalo em segundos. 0 desliga.
      WF_PATRIMONIO_SYNC_INTERVAL_SECS: "${WF_PATRIMONIO_SYNC_INTERVAL_SECS:-900}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8088/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Endurecimento no padrão dos outros apps do VPS (10/10/2026, DOCK-01): era
    # o único contêiner de produção sem `cap_drop`, limites e rotação de log.
    # O servidor roda como 1000:1000 numa porta acima de 1024 e não precisa de
    # capability nenhuma. Em repouso usa ~6 MiB e 6 processos; o teto de PIDs
    # deixa folga ao pool de threads bloqueantes do tokio.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    init: true
    cpus: 2.0
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wealthfolio-teste-data:
    name: wealthfolio-teste-data
    driver: local
