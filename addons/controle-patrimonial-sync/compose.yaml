name: wealthfolio-addon-sim

# Simulação do add-on contra um host Wealthfolio simulado, sem Node.js no host
# e sem rede: nenhuma escrita em CB, CRV ou Wealthfolio. Rode antes de empacotar.
services:
  addon-sim:
    image: node:26-alpine
    pull_policy: always
    working_dir: /workspace
    network_mode: none
    volumes:
      - .:/workspace:ro
    command: ["node", "sim/run.mjs"]

  addon-build:
    image: node:26-alpine
    pull_policy: always
    profiles: [build]
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["sh", "-ec", "apk add --no-cache zip && npm ci --no-audit --no-fund && npm audit --audit-level=low --no-fund && npm run bundle"]
