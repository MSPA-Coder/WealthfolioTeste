name: wealthfolio-addon-build

# Build do pacote instalável sem Node.js no host. O artefato aparece em
# addons/controle-patrimonial-sync/release/ e deve ser carregado pela tela
# Settings > Addons da instância Wealthfolio.
services:
  addon-build:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /workspace
    volumes:
      - ./addons/controle-patrimonial-sync:/workspace
    command: ["sh", "-ec", "apk add --no-cache zip && npm ci && npm run bundle"]
