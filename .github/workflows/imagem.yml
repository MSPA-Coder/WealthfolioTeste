name: Imagem

# Constrói a imagem que o VPS roda, a partir do upstream fixado e de
# `patches/`, e roda os testes do upstream nos módulos que os patches mexem.
# É lento (o servidor em Rust compila do zero), então só roda quando muda o
# que entra na imagem. O cron semanal puxa as tags móveis das imagens-base e
# verifica se o crates.io ainda serve o que o build pede.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, "patches/**", .github/workflows/imagem.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, "patches/**", .github/workflows/imagem.yml]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 2"

permissions:
  contents: read

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagem:
    name: Build, testes dos patches e partida
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Testes do upstream nos módulos dos patches
        run: docker build --pull --target testes .

      # Reaproveita as camadas do passo anterior: só a imagem final é nova.
      - name: Imagem final
        run: docker build --pull -t wealthfolio-teste:ci .

      # Sobe como no VPS: banco cifrado exigido, chave mestra por arquivo,
      # sistema de arquivos só de leitura e as mesmas restrições do compose.yaml
      # (sem capability, limites de memória, PIDs e CPU, init). O critério é o
      # do deploy.sh, o /api/v1/healthz respondendo "ok". A chave é efêmera e
      # não protege nada.
      - name: A imagem sobe e responde
        run: |
          set -euo pipefail
          chave="$RUNNER_TEMP/chave-mestra"
          openssl rand -base64 32 > "$chave"
          chmod 644 "$chave"
          docker run -d --name wf -p 127.0.0.1:18088:8088 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true --init \
            --memory 512m --pids-limit 256 --cpus 2 \
            -v wf-dados:/data -v "$chave:/run/secrets/wealthfolio_master_key:ro" \
            -e WF_LISTEN_ADDR=0.0.0.0:8088 -e WF_DB_PATH=/data/wealthfolio.db \
            -e WF_SECRET_KEY_FILE=/run/secrets/wealthfolio_master_key \
            -e WF_DB_REQUIRE_ENCRYPTION=1 -e WF_AUTH_REQUIRED=false \
            wealthfolio-teste:ci
          for _ in $(seq 1 60); do
            if [ "$(curl -fsS http://127.0.0.1:18088/api/v1/healthz 2>/dev/null)" = ok ]; then
              echo "healthz: ok"
              exit 0
            fi
            sleep 2
          done
          docker logs wf | tail -50
          exit 1

      - name: Varredura de vulnerabilidade da imagem final
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          chmod 777 "$RUNNER_TEMP/trivy-cache"
          docker save wealthfolio-teste:ci -o "$RUNNER_TEMP/imagem.tar"
          docker compose -f .github/docker-compose.yml run --rm trivy \
            --cache-dir /tmp/trivy-cache \
            image --input /varredura/imagem.tar \
                  --scanners vuln \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 1 \
                  --format table
