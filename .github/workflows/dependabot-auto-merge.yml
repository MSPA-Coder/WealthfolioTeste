name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI", "Imagem"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: Auto merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
       github.event.workflow_run.head_branch == 'automation/wealthfolio-upstream') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Merge only the exact tested dependency or upstream commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "$REPO" --state open --head "$HEAD_BRANCH" --json number,headRefOid,headRefName,author,baseRefName)"
          candidatos="$(jq -c --arg sha "$HEAD_SHA" '[.[] | select(.headRefOid == $sha and ((.author.login == "dependabot[bot]") or (.author.login == "app/dependabot") or (.author.login == "github-actions[bot]" and .headRefName == "automation/wealthfolio-upstream")) and .baseRefName == "main")]' <<< "$prs")"
          quantidade="$(jq 'length' <<< "$candidatos")"
          if [[ "$quantidade" -eq 0 ]]; then
            echo "Evento obsoleto: não há PR aberto para o SHA testado; nada a mesclar."
            exit 0
          fi
          if [[ "$quantidade" -ne 1 ]]; then
            echo "Mais de um PR aberto corresponde ao SHA testado." >&2
            exit 1
          fi
          pr="$(jq -er '.[0].number' <<< "$candidatos")"
          arquivos="$(gh pr view "$pr" --repo "$REPO" --json files --jq '[.files[].path] | .[]')"
          imagem_obrigatoria=false
          while IFS= read -r arquivo; do
            case "$arquivo" in
              Dockerfile|.dockerignore|patches/*|.github/workflows/imagem.yml)
                imagem_obrigatoria=true
                ;;
            esac
          done <<< "$arquivos"
          sha_testado="$HEAD_SHA"

          validar_checks() {
            local sha="$1"
            local checks
            checks="$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100")"
            jq -e '
              .total_count > 0 and
              .total_count == (.check_runs | length) and
              ([.check_runs[] | select(.name != "Auto merge" and .name != "Dependabot" and .name != "update-uv-graph" and .name != "update-pip-graph")] | length) > 0 and
              all(.check_runs[] | select(.name != "Auto merge" and .name != "Dependabot" and .name != "update-uv-graph" and .name != "update-pip-graph");
                .status == "completed" and
                (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped"))
            ' <<< "$checks" >/dev/null
          }

          validar_checks "$sha_testado"
          for tentativa in 1 2 3 4; do
            pr_base="$(gh pr view "$pr" --repo "$REPO" --json baseRefOid --jq .baseRefOid)"
            main_base="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
            if [[ "$pr_base" == "$main_base" ]]; then
              break
            fi
            if [[ "$tentativa" -eq 4 ]]; then
              echo "main continuou avançando durante as novas verificações; o PR fica aberto." >&2
              exit 1
            fi

            echo "PR atrasado em relação a main; atualizando e aguardando os testes no novo SHA (tentativa $tentativa)."
            gh pr update-branch "$pr" --repo "$REPO"
            ci_url="$(gh workflow run ci.yml --repo "$REPO" --ref "$HEAD_BRANCH")"
            ci_run_id="${ci_url##*/}"
            if [[ ! "$ci_run_id" =~ ^[0-9]+$ ]]; then
              echo "Não consegui identificar a execução da CI disparada: $ci_url" >&2
              exit 1
            fi
            gh run watch "$ci_run_id" --repo "$REPO" --exit-status --interval 10
            sha_ci="$(gh run view "$ci_run_id" --repo "$REPO" --json headSha --jq .headSha)"
            if [[ "$imagem_obrigatoria" == true ]]; then
              imagem_url="$(gh workflow run imagem.yml --repo "$REPO" --ref "$HEAD_BRANCH")"
              imagem_run_id="${imagem_url##*/}"
              if [[ ! "$imagem_run_id" =~ ^[0-9]+$ ]]; then
                echo "Não consegui identificar a execução de Imagem: $imagem_url" >&2
                exit 1
              fi
              gh run watch "$imagem_run_id" --repo "$REPO" --exit-status --interval 10
              sha_imagem="$(gh run view "$imagem_run_id" --repo "$REPO" --json headSha --jq .headSha)"
            else
              sha_imagem="$sha_ci"
            fi
            sha_testado="$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)"
            if [[ "$sha_ci" != "$sha_testado" || "$sha_imagem" != "$sha_testado" ]]; then
              echo "CI ou Imagem não testou o SHA atual do PR; o merge foi cancelado." >&2
              exit 1
            fi
            validar_checks "$sha_testado"
          done

          pr_base="$(gh pr view "$pr" --repo "$REPO" --json baseRefOid --jq .baseRefOid)"
          main_base="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
          if [[ "$pr_base" != "$main_base" ]]; then
            echo "O PR ficou atrasado antes do merge; mantendo-o aberto." >&2
            exit 1
          fi

          gh pr merge "$pr" --repo "$REPO" --squash
          gh workflow run ci.yml --repo "$REPO" --ref main
          if [[ "$imagem_obrigatoria" == true ]]; then
            gh workflow run imagem.yml --repo "$REPO" --ref main
          fi
